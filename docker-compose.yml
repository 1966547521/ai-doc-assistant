services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/data
      SEMANTIC_MODEL_PATH: /app/models/potion-multilingual-128M
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  api:
    build: .
    command: python -m api.server
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /app/data
      SEMANTIC_MODEL_PATH: /app/models/potion-multilingual-128M
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
